id: org.freedesktop.Platform.electron
branch: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
build-extension: true
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/debug
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/doc
  - /share/gtk-doc
modules:
  - name: electron
    buildsystem: simple
    build-options:
      no-debuginfo: true
    build-commands:
      - unzip electron.zip -d ${FLATPAK_DEST}
    sources:
      - type: file
        dest-filename: electron.zip
        only-arches: [aarch64]
        url: 
          https://github.com/electron/electron/releases/download/v45.2.1/electron-v45.2.1-linux-arm64.zip
        sha256: e04e635e7312f4b361664e18319aefddbcaaebfdee9c8d9a521e520aa8d385bb
        x-checker-data:
          type: anitya
          project-id: 17779
          stable-only: true
          url-template: 
            https://github.com/electron/electron/releases/download/v$version/electron-v$version-linux-arm64.zip
      - type: file
        dest-filename: electron.zip
        only-arches: [x86_64]
        url: 
          https://github.com/electron/electron/releases/download/v45.2.1/electron-v45.2.1-linux-x64.zip
        sha256: 616efc1ae4784af1a4f3f0e8774e73e7030e7bd1708da9d09bcf543dfa499beb
        x-checker-data:
          type: anitya
          project-id: 17779
          stable-only: true
          url-template: 
            https://github.com/electron/electron/releases/download/v$version/electron-v$version-linux-x64.zip
